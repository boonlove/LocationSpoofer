name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Android CI
    uses: ./.github/workflows/android.yml
    secrets: inherit

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # 需要完整的提交历史来获取 tag 和并生成 changelog

      - name: 检查是否为 Pre-release
        id: check_prerelease
        run: |
          if echo "${{ github.ref }}" | grep -q "beta"; then
            echo "Pre-release version"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release version"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 清理 Pre-Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --repo "${{ github.repository }}" --json tagName,isPrerelease --jq '.[] | select(.isPrerelease == true) | .tagName' |
          while read tag; do
            if [ -n "$tag" ]; then
              echo "Deleting pre-release: $tag"
              gh release delete "$tag" --repo "${{ github.repository }}" --yes
            fi
          done

      - name: 生成更新日志
        id: changelog
        run: |
          # 获取 tag
          CURR_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          PREV_TAG=$(git tag --sort=-creatordate | grep -v "^${CURR_TAG}$" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || echo "")

          if [ -z "$CURR_TAG" ]; then
            CURR_TAG="HEAD"
          fi

          # 获取提交记录
          if [ -z "$PREV_TAG" ]; then
            echo "没有找到上一个 tag，获取到 ${CURR_TAG} 的提交记录。"
            COMMITS=$(git log $CURR_TAG --no-merges --pretty=format:"%s")
          else
            echo "获取到 ${PREV_TAG}..${CURR_TAG} 的提交记录。"
            COMMITS=$(git log $PREV_TAG..$CURR_TAG --no-merges --pretty=format:"%s")
          fi

          {
            # 提取功能更新 (feat)
            FEATS=$(echo "$COMMITS" | grep "^feat" | sed -E 's/^feat:?[[:space:]]*/- /' || true)
            if [ -n "$FEATS" ]; then
              echo "## 功能"
              echo "$FEATS"
              echo ""
            fi

            # 提取优化与改进 (refactor)
            REFACTOR=$(echo "$COMMITS" | grep "^refactor" | sed -E 's/^refactor:?[[:space:]]*/- /' || true)
            if [ -n "$REFACTOR" ]; then
              echo "## 优化与改进"
              echo "$REFACTOR"
              echo ""
            fi

            # 提取修复 (fix)
            FIXES=$(echo "$COMMITS" | grep "^fix" | sed -E 's/^fix:?[[:space:]]*/- /' || true)
            if [ -n "$FIXES" ]; then
              echo "## 修复"
              echo "$FIXES"
              echo ""
            fi

            # 如果没有任何匹配的内容，至少留一行记录
            if [ -z "$FEATS" ] && [ -z "$FIXES" ] && [ -z "$REFACTOR" ]; then
              echo "常规更新与优化"
            fi
          } > changelog.md

          cat changelog.md

      - name: 下载 APK
        uses: actions/download-artifact@v8
        with:
          pattern: "*.apk"
          path: artifact
          merge-multiple: true
          skip-decompress: true

      - name: 创建 GitHub Release
        if: success()
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: changelog.md
          files: artifact/*.apk
          generate_release_notes: false
          prerelease: ${{ steps.check_prerelease.outputs.prerelease }}
